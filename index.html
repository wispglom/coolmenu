<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%;
            height: 100%;
            background: #000;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: auto; /* allow scroll if needed */
        }

        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* show full image, no crop */
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="image.jpg" alt="Static image">
    </div>
</body>
</html>
